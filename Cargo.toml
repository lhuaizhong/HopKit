[workspace]
members = ["crates/netbox-core", "crates/netbox-cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/lhuaizhong/netbox"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
netbox-core = { path = "crates/netbox-core" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

