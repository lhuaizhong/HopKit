[package]
name = "hopkit-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
socket2 = { version = "0.6", features = ["all"] }
ipnet = "2"
fs2 = "0.4"
url = "2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
httparse = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }


[dependencies.magic-wormhole]
version = "=0.8.1"
default-features = false
features = ["transfer", "native-tls"]

[dependencies.smol]
version = "2"
[dependencies.futures]
version = "0.3"
[dependencies.async-channel]
version = "2"
[dependencies.async-fs]
version = "2"
[dependencies.sha2]
version = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
