<!doctype html>
<html><head><meta charset="UTF-8"><title>HopKit result image regression</title></head>
<body>
<button id="run">Test image export</button>
<pre id="report">Ready</pre>
<div id="source" class="results-column" style="width:760px;padding:12px;background:white">
  <div class="latency-chart">
    <b>Ping / TCPing · ms</b>
    <div class="chart-grid">
      <div class="chart-axis"><span>100</span><span>50</span><span>0 ms</span></div>
      <div class="chart-bars">
        <div class="chart-slot" style="left:10%;width:6%"><i style="height:1%"></i></div>
        <div class="chart-slot" style="left:30%;width:6%"><i style="height:25%"></i></div>
        <div class="chart-slot" style="left:50%;width:6%"><i style="height:55%"></i></div>
        <div class="chart-slot" style="left:70%;width:6%"><i style="height:100%"></i></div>
        <div class="chart-slot" style="left:90%;width:6%"><b class="failure-marker">×</b></div>
      </div>
    </div>
  </div>
  <div class="throughput-chart">
    <b>iperf3 · Mbps</b>
    <div class="throughput-bars"><span style="height:1%"></span><span style="height:25%"></span><span style="height:55%"></span><span style="height:100%"></span></div>
    <small>0 Mbps</small>
  </div>
</div>
<div id="images"></div>
<script type="module">
import '../src/style.css'
import '../src/appearance.css'
import {resultImage} from '../src/result-image'

const source=document.querySelector('#source')
const report=document.querySelector('#report')
const results=[]
const artifact=(name,content)=>window.webkit?.messageHandlers?.artifact?.postMessage({name,content})
const imageFrom=src=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src})
async function run(){
  results.length=0
  document.querySelector('#images').replaceChildren()
  try{
    for(const theme of ['fresh','readable']){
      document.documentElement.dataset.theme=theme
      await document.fonts.ready
      const before=source.outerHTML
      const scroll={x:scrollX,y:scrollY}
      // Capture the serialized export so the test can measure its chart bounds.
      let svg
      const descriptor=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src')
      Object.defineProperty(HTMLImageElement.prototype,'src',{...descriptor,set(value){
        if(value.startsWith('data:image/svg+xml'))svg=decodeURIComponent(value.slice(value.indexOf(',')+1))
        descriptor.set.call(this,value)
      }})
      let blob
      try{blob=await resultImage(source,false)}finally{Object.defineProperty(HTMLImageElement.prototype,'src',descriptor)}
      artifact(`${theme}.svg`,svg)
      if(source.outerHTML!==before||scrollX!==scroll.x||scrollY!==scroll.y)throw Error('Export changed the live result or scroll')
      const data=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(blob)})
      artifact(`${theme}.png`,data)
      const img=await imageFrom(data)
      const canvas=document.createElement('canvas');canvas.width=img.width;canvas.height=img.height
      const context=canvas.getContext('2d');context.drawImage(img,0,0)
      const pixels=context.getImageData(0,0,img.width,img.height).data
      const markup=new DOMParser().parseFromString(svg,'image/svg+xml')
      const wrapper=document.importNode(markup.querySelector('foreignObject').firstElementChild,true)
      const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-100000px;top:0';holder.append(wrapper);document.body.append(holder)
      try{
        const origin=wrapper.getBoundingClientRect();const scale=img.width/origin.width
        for(const selector of ['.chart-bars','.throughput-bars']){
          const chart=wrapper.querySelector(selector);const liveChart=source.querySelector(selector)
          const bars=[...chart.querySelectorAll('i,span')];const liveBars=[...liveChart.querySelectorAll('i,span')]
          const chartRect=chart.getBoundingClientRect()
          const baseline=(chartRect.bottom-parseFloat(getComputedStyle(chart).borderBottomWidth)-origin.top)*scale
          const checks=bars.map((bar,index)=>{
            const rect=bar.getBoundingClientRect();const color=getComputedStyle(liveBars[index]).backgroundColor.match(/\d+/g).slice(0,3).map(Number)
            const x=Math.floor((rect.left+rect.width/2-origin.left)*scale)
            const rows=[]
            for(let y=Math.max(0,Math.floor((chartRect.top-origin.top)*scale));y<Math.min(img.height,Math.ceil((chartRect.bottom-origin.top)*scale));y++){
              const offset=(y*img.width+x)*4
              if(color.every((v,c)=>Math.abs(pixels[offset+c]-v)<8)&&pixels[offset+3]>240)rows.push(y)
            }
            const top=rows[0];const bottom=rows.at(-1)+1
            const expectedHeight=liveBars[index].getBoundingClientRect().height*scale
            const ok=rows.length>0&&Math.abs(bottom-baseline)<=2&&Math.abs(bottom-top-expectedHeight)<=3
            return {index,ok,top,bottom,baseline,expectedHeight,height:bottom-top}
          })
          results.push({theme,selector,ok:checks.every(x=>x.ok),checks})
        }
      }finally{holder.remove()}
      document.querySelector('#images').append(img)
    }
    const outcome={status:results.every(x=>x.ok)?'passed':'failed',results}
    report.textContent=JSON.stringify(outcome,null,2);artifact('report.json',report.textContent)
  }catch(error){report.textContent=JSON.stringify({status:'failed',error:String(error),results},null,2);artifact('report.json',report.textContent)}
}
document.querySelector('#run').addEventListener('click',run)
if(new URL(location.href).searchParams.has('autorun'))run()
</script></body></html>
