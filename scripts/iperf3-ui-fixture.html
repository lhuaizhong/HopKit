<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HopKit native iperf3 result fixture</title><style>#exported-json,#exported-image{display:none}</style></head><body><div id="app"></div>
<script type="module">
// Development only. Display a real CLI result generated by iperf3-test.py.
import {mockIPC} from '@tauri-apps/api/mocks'
import {createApp} from 'vue'
import App from '../src/App.vue'
import '../src/style.css'
import '../src/appearance.css'
const result=await (await fetch('/test-output/iperf3/ui-result.json')).json()
const tasks=[{id:result.task_id,tool:'iperf3',action:'client',target:result.request.target,
 port:result.request.port,request:result.request,status:result.status,started_at:'00001',seq:2,
 events:[{...result.data,event_type:'stats',cursor:1},{...result.data,event_type:'test_complete',cursor:2}],
 latest_stats:result.data,result}]
mockIPC((command,args)=>{
 if(command==='app_info')return {version:'iperf3-ui-fixture',platform:'macOS · recorded native result',os:'macOS'}
 if(command==='list_tasks')return tasks.map(({result,events,latest_stats,...rest})=>({...rest,result:null,events:[]}))
 if(command==='task_poll'){const task=tasks.find(x=>x.id===args.id);return {...task,events:task.events.filter(x=>x.cursor>args.after)}}
 if(command==='start_task'){
  const r=args.request,id=`ui-test-${tasks.length}`
  tasks.push({id,tool:r.tool,action:r.action,target:r.action==='serve'?`${r.listen}:${r.port}`:r.target,port:r.port,
   request:r,status:'running',started_at:String(Date.now()),seq:0,events:[],latest_stats:null,result:null});return id
 }
 if(command==='cancel_task'){const task=tasks.find(x=>x.id===args.id);task.status='cancelled';task.result={status:'cancelled',data:null,error:{code:'CANCELLED',message:'UI fixture stopped'}};return}
 if(command==='export_result'){const pre=document.createElement('pre');pre.id='exported-json';pre.textContent=args.content;document.body.append(pre);return true}
 if(command==='export_result_image'){const img=document.createElement('img');img.id='exported-image';img.src='data:image/png;base64,'+btoa(args.png.map(x=>String.fromCharCode(x)).join(''));document.body.append(img);return true}
 throw new Error(`Unhandled fixture command: ${command}`)
})
createApp(App).mount('#app')
</script></body></html>
